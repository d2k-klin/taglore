name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ and schema/ are up to date
        run: |
          if ! git diff --exit-code -- dist schema; then
            echo "::error::dist/ or schema/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create a throwaway repo with tags
        run: |
          mkdir -p "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          git init -q -b main && git config user.email ci@example.com && git config user.name ci
          echo 1 > a && git add . && git commit -qm "feat: first feature" && git tag v1.0.0
          echo 2 > b && git add . && git commit -qm "fix: a bug" && git tag v1.0.1
          echo 3 > c && git add . && git commit -qm "feat(search): fuzzy search" && git tag v1.1.0
      - id: notes
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/demo
          to: v1.1.0
          ai-provider: none
          publish-github-release: false
          output-dir: out
          preview-file: review/preview.html
          web-components: true
      - run: |
          test "${{ steps.notes.outputs.previous-version }}" = "v1.0.0"
          test "${{ steps.notes.outputs.announce }}" = "true"
          test -f "$RUNNER_TEMP/demo/out/latest.json"
          test "${{ steps.notes.outputs.unverified-statements }}" = "0"
          # The demo tags (v1.0.x) also exist as real releases of this repository, so earlier
          # entries may be picked up from GitHub. Only the newest entry is asserted.
          test "$(jq -r '.releases[0].version' "$RUNNER_TEMP/demo/out/history.json")" = "v1.1.0"
          test "$(jq -r '.highlights[0].commits | length' "$RUNNER_TEMP/demo/out/release.json")" = "1"
          test -s "$RUNNER_TEMP/demo/review/preview.html"
          test ! -e "$RUNNER_TEMP/demo/out/preview.html"
          grep -q "taglore-changelog" "$RUNNER_TEMP/demo/out/taglore-whats-new.js"

  security-smoke-test:
    # Real Syft + Grype against a demo repo: lodash goes from 4.17.15 (known advisories) to 4.17.21.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create a throwaway repo with a vulnerable and a fixed release
        run: |
          mkdir -p "$RUNNER_TEMP/sec" && cd "$RUNNER_TEMP/sec"
          git init -q -b main && git config user.email ci@example.com && git config user.name ci
          lock() {
            cat > package-lock.json <<JSON
          {"name":"demo","version":"1.0.0","lockfileVersion":3,"requires":true,
           "packages":{"":{"name":"demo","version":"1.0.0","dependencies":{"lodash":"$1"}},
           "node_modules/lodash":{"version":"$1","resolved":"https://registry.npmjs.org/lodash/-/lodash-$1.tgz","license":"MIT"}}}
          JSON
            echo '{"name":"demo","version":"1.0.0","dependencies":{"lodash":"'"$1"'"}}' > package.json
          }
          lock 4.17.15 && git add . && git commit -qm "feat: first release" && git tag v1.0.0
          lock 4.17.21 && git add . && git commit -qm "fix: upgrade lodash" && git tag v1.1.0
      - id: notes
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/sec
          to: v1.1.0
          ai-provider: none
          publish-github-release: false
          output-dir: out
          security-scan: true
          security-fail-on: high
      - name: Check the security results
        run: |
          echo "open=${{ steps.notes.outputs.security-open }} introduced=${{ steps.notes.outputs.security-introduced }} fixed=${{ steps.notes.outputs.security-fixed }}"
          test "${{ steps.notes.outputs.security-fixed }}" -gt 0
          test "${{ steps.notes.outputs.security-introduced }}" = "0"
          test -s "$RUNNER_TEMP/sec/out/security.json"
          test -s "$RUNNER_TEMP/sec/out/sbom.cdx.json"
          grep -q "### 🔒 Security" "$RUNNER_TEMP/sec/out/RELEASE_NOTES.md"
          sed -n '/### 🔒 Security/,/<sub>/p' "$RUNNER_TEMP/sec/out/RELEASE_NOTES.md" >> "$GITHUB_STEP_SUMMARY"

      # Two-step Docker flow: notes before the build (baked into the image), image scan after it.
      - id: before-build
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/sec
          to: v1.1.0
          ai-provider: none
          publish-github-release: false
          output-dir: out-a
      - name: Build an old and a new image (Alpine 3.14.0 -> 3.20.3)
        run: |
          printf 'FROM alpine:3.14.0\n' | docker build -q -t taglore-demo:v1.0.0 -
          printf 'FROM alpine:3.20.3\nCOPY out-a/ /srv/release-notes/\n' > "$RUNNER_TEMP/sec/Dockerfile.ci"
          docker build -q -t taglore-demo:v1.1.0 -f "$RUNNER_TEMP/sec/Dockerfile.ci" "$RUNNER_TEMP/sec"
      - id: after-build
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/sec
          to: v1.1.0
          ai-provider: none
          publish-github-release: false
          notes-from: out-a/release.json
          security-image: taglore-demo:{version}
          output-dir: out-b
      - name: Check the image scan
        run: |
          echo "image: open=${{ steps.after-build.outputs.security-open }} introduced=${{ steps.after-build.outputs.security-introduced }} fixed=${{ steps.after-build.outputs.security-fixed }}"
          # Upgrading the base image from Alpine 3.14.0 must fix OS package findings on top of lodash.
          test "${{ steps.after-build.outputs.security-fixed }}" -gt "${{ steps.notes.outputs.security-fixed }}"
          test -s "$RUNNER_TEMP/sec/out-b/sbom-image.cdx.json"
          grep -q '"apk"' "$RUNNER_TEMP/sec/out-b/security.json"
          grep -q "the image taglore-demo:v1.1.0" "$RUNNER_TEMP/sec/out-b/RELEASE_NOTES.md"
          # The notes text is reused, not regenerated.
          test "$(jq -r .title "$RUNNER_TEMP/sec/out-a/release.json")" = "$(jq -r .title "$RUNNER_TEMP/sec/out-b/release.json")"
          { echo; echo "#### With the image scan"; sed -n '/### 🔒 Security/,/<sub>/p' "$RUNNER_TEMP/sec/out-b/RELEASE_NOTES.md"; } >> "$GITHUB_STEP_SUMMARY"
