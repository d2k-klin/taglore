# Releases Taglore with Taglore.
#
# Two ways to release:
#   1. Bump "version" in packages/taglore/package.json and merge to main: the tag vX.Y.Z is created here.
#   2. Push a vX.Y.Z tag yourself.
# Either way, the notes are written by Taglore and the vX major tag is moved for `uses: d2k-klin/taglore@vX`.
# The CLI and the components are attached to every release as installable tarballs (no npm account needed).
# If an NPM_TOKEN secret exists, both packages are also published to npm.
name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/taglore/package.json
      - .github/workflows/release.yml
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Optional: a fine-grained PAT (Contents + Workflows: write) lets the vX major tag move even when
          # workflow files changed since the last release. The default token cannot update such refs.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - id: version
        name: Determine release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(node -p "require('./packages/taglore/package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx taglore.json; then
              echo "$TAG is already released, nothing to do."
              echo "create=skip" >> "$GITHUB_OUTPUT"
            else
              echo "$TAG exists but its release is incomplete; regenerating the notes."
              echo "create=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.version.outputs.create == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Taglore $TAG"
          git push origin "refs/tags/$TAG"

      - name: Release notes (written by Taglore)
        if: steps.version.outputs.create != 'skip'
        uses: ./
        with:
          to: ${{ steps.version.outputs.tag }}
          # Optional secret. Without it, Copilot calls fail and Taglore falls back to commit-based notes.
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          product-name: Taglore
          audience: developers who use the Taglore GitHub Action, CLI and What's New components

      - name: Move major tag
        if: steps.version.outputs.create != 'skip' && !contains(steps.version.outputs.tag, '-')
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG^{commit}"
          if ! git push -f origin "refs/tags/$MAJOR"; then
            echo "::warning::Could not move $MAJOR to $TAG (workflow files changed and the token lacks the workflows permission). Add a RELEASE_TOKEN secret, or run: git tag -f $MAJOR $TAG && git push -f origin $MAJOR"
          fi

      - name: Attach installable packages to the release
        if: steps.version.outputs.create != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build -w taglore -w @taglore/whats-new
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack -w taglore -w @taglore/whats-new --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          # Version-less copies give stable URLs: releases/latest/download/taglore.tgz
          cp taglore-[0-9]*.tgz taglore.tgz
          cp taglore-whats-new-[0-9]*.tgz taglore-whats-new.tgz
          gh release upload "$TAG" ./*.tgz --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to npm (only when an NPM_TOKEN secret exists)
        if: steps.version.outputs.create != 'skip'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "No NPM_TOKEN secret; skipping npm. The release tarballs are the supported install path."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc"
          for dir in packages/taglore packages/whats-new; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm."
            else
              npm publish "./$dir" --access public --userconfig "$RUNNER_TEMP/npmrc"
            fi
          done
