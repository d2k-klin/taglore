<!doctype html>
<!-- Works in any frontend: plain HTML, server templates (Django, Rails, Laravel, Thymeleaf, Razor), Vue, Angular, Svelte. -->
<html lang="en">
  <body>
    <main>Your app</main>

    <script type="module" src="/release-notes/taglore-whats-new.js"></script>
    <taglore-whats-new
      src="/release-notes/latest.json"
      storage-key="myapp:whats-new"
      label-heading="What's new"
      label-close="Got it"
    ></taglore-whats-new>

    <!-- Optional "What's new" menu entry that reopens the last announcement -->
    <button onclick="document.querySelector('taglore-whats-new').show()">What's new</button>
  </body>
</html>
