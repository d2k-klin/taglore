<!doctype html>
<!-- A searchable changelog page for any frontend. history.json is written by Taglore next to latest.json. -->
<html lang="en">
  <body>
    <main style="max-width: 760px; margin: 2rem auto">
      <h1>Changelog</h1>
      <script type="module" src="/release-notes/taglore-whats-new.js"></script>
      <taglore-changelog src="/release-notes/history.json" label-search="Search releases"></taglore-changelog>
      <!-- announced-only hides patch releases; no-search hides the search box -->
    </main>
  </body>
</html>
